spring:
  application:
    name: web-hotel-mis-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Database and security configuration will be enabled per environment.
# Never commit credentials here; use environment variables or a secret manager.
