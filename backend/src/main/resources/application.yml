spring:
  application:
    name: web-hotel-mis-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/QLKS?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration

hotel:
  policy:
    hourly-minimum: ${HOTEL_HOURLY_MINIMUM:3}
    late-checkout-grace-minutes: ${HOTEL_LATE_GRACE_MINUTES:20}
    vip-discount-percent: ${HOTEL_VIP_DISCOUNT_PERCENT:10}
    vip-spend-threshold: ${HOTEL_VIP_SPEND_THRESHOLD:10000000}
    vip-stay-threshold: ${HOTEL_VIP_STAY_THRESHOLD:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Database and security are active; use environment variables for environment-specific values.
# Never commit credentials here; use environment variables or a secret manager.
